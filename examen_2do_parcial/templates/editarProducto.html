<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Producto a editar</h1>
        <form action="/actualizar/{{ producto.0 }}" method="POST">
            <input type="text" name="Nombre" value="{{ producto.1 }}">
            <input type="text" name="Descripcion" value="{{ producto.2 }}">
            <input type="text" name="Precio" value="{{ producto.3 }}">
            <input type="text" name="Stock" value="{{ producto.4 }}">
            <button class="btn btn-soft btn-secondary" type="submit">Actualizar</button> 

        </form>

    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</html>
