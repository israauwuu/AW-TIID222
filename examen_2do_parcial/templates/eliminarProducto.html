<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Producto a eliminar</h1>
        <form action="/eliminar/{{ producto.0 }}" method="POST">
            <input type="text" name="Nombre" value="{{ producto.1 }}" readonly>
            <input type="text" name="Descripcion" value="{{ producto.2 }}" readonly>
            <input type="text" name="Precio" value="{{ producto.3 }}" readonly>
            <input type="text" name="Stock" value="{{ producto.4 }}" readonly>
            <button type="submit">Eliminar</button> 

        </form>

        <script>
            function Eliminar(){
                return confirm("¿Estas seguro de eliminar el producto?");
            }
            function Regresar(){
                window.location.href="{{url_for('index')}}";
            }
        </script>

    </div>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</html>
